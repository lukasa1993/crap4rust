name: Refresh generated crap4rust core

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.head_ref == 'refresh-crap4rust-generated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refresh-crap4rust-generated
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the canonical source
        run: |
          rm -rf /tmp/crap4rust-generated
          python tools/quality_tool_generator_logical_fix.py --repo crap4rust --output /tmp/crap4rust-generated
          cp /tmp/crap4rust-generated/src/crap4rust/core.py src/crap4rust/core.py
      - name: Build and test the refreshed source
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pytest -q
          crap4rust --version
          crap4rust --help
          rustc --crate-type lib tests/fixtures/sample.rs -o /tmp/libsample.rlib
      - name: Commit only the verified generated source
        run: |
          rm .github/workflows/refresh-crap4rust-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crap4rust/core.py .github/workflows/refresh-crap4rust-generated.yml
          git diff --cached --exit-code && exit 0
          git commit -m "Refresh crap4rust from the reviewed generator"
          git push origin HEAD:refresh-crap4rust-generated
