name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-rust-scope:
    if: github.ref == 'refs/heads/rust-scope-v202' || github.event.pull_request.head.ref == 'rust-scope-v202'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rust-scope-v202
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Integrate and verify Cargo-aware Rust scope
        shell: bash
        run: |
          if grep -q '^mod scope;' src/lib.rs; then
            echo 'Rust scope integration is already applied.'
            exit 0
          fi
          mkdir -p target
          rustc tools/patch_rust_scope.rs -o target/patch-rust-scope
          target/patch-rust-scope
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo test --all-targets --all-features
          cargo check --locked --all-targets --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/lib.rs src/scope.rs
          git commit -m "Use Cargo-aware Rust scope and complete complexity"
          git fetch origin rust-scope-v202
          git rebase origin/rust-scope-v202
          git push origin HEAD:rust-scope-v202

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/crap4rust.exe --version
            target/native-install/bin/crap4rust.exe --help >/dev/null
          else
            target/native-install/bin/crap4rust --version
            target/native-install/bin/crap4rust --help >/dev/null
          fi
      - name: Install Rust coverage tool
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --version
      - name: End-to-end Rust coverage and CRAP check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/coverage-crate"
          report="$fixture/target/coverage/lcov.info"
          cd "$fixture"
          cargo llvm-cov clean
          mkdir -p target/coverage
          cargo llvm-cov --all-features --lcov --output-path "$report"
          test -s "$report"
          "$GITHUB_WORKSPACE/target/native-install/bin/crap4rust" \
            --root "$fixture" \
            --coverage "$report" \
            --no-test \
            --fail-over 6 \
            --json

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
