name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-reproducibility-v202
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable
      - name: Generate and commit Cargo.lock
        run: |
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock || [ -n "$(git ls-files --others --exclude-standard Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Commit Cargo.lock for reproducible builds"
            git push origin HEAD:release-reproducibility-v202
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy stable locked
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test stable locked
        run: cargo test --locked --all-targets --all-features
      - name: Build release locked
        run: cargo build --locked --release
      - name: Cargo install locked
        run: |
          cargo install --path . --locked --root target/native-install --force
          target/native-install/bin/crap4rust --version
          target/native-install/bin/crap4rust --help
      - name: Verify declared MSRV
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --locked --all-targets --all-features
      - name: Install Rust coverage tool
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --version
      - name: End-to-end Rust coverage and CRAP check
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/coverage-crate"
          report="$fixture/target/coverage/lcov.info"
          cd "$fixture"
          cargo llvm-cov clean
          mkdir -p target/coverage
          cargo llvm-cov --all-features --lcov --output-path "$report"
          test -s "$report"
          "$GITHUB_WORKSPACE/target/native-install/bin/crap4rust" \
            --root "$fixture" \
            --coverage "$report" \
            --no-test \
            --fail-over 6 \
            --json
