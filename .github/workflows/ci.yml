name: Cargo cfg fidelity probe

on:
  push:
    branches:
      - cfg-fidelity-probe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify cargo rustc exposes build-script cfg
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/cfg-probe"
          mkdir -p "$fixture/src"
          cat > "$fixture/Cargo.toml" <<'EOF'
          [package]
          name = "cfg-probe"
          version = "0.1.0"
          edition = "2021"
          build = "build.rs"
          EOF
          cat > "$fixture/build.rs" <<'EOF'
          fn main() {
              println!("cargo::rustc-check-cfg=cfg(tool_probe)");
              println!("cargo::rustc-check-cfg=cfg(tool_value, values(\"enabled\"))");
              println!("cargo::rustc-cfg=tool_probe");
              println!("cargo::rustc-cfg=tool_value=\"enabled\"");
          }
          EOF
          cat > "$fixture/src/lib.rs" <<'EOF'
          #[cfg(tool_probe)]
          pub fn active() -> bool { true }
          EOF
          cd "$fixture"
          cargo rustc --lib -- --print cfg | tee "$RUNNER_TEMP/cargo-cfg.txt"
          grep -Fx 'tool_probe' "$RUNNER_TEMP/cargo-cfg.txt"
          grep -Fx 'tool_value="enabled"' "$RUNNER_TEMP/cargo-cfg.txt"
