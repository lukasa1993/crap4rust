name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-audit-branch:
    if: github.ref == 'refs/heads/audit-test-cfg-scope-20260823' || github.head_ref == 'audit-test-cfg-scope-20260823'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-test-cfg-scope-20260823
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply embedded native Rust patch and clean audit files
        shell: bash
        run: |
          awk '
            /cat > "\$RUNNER_TEMP\/patch.rs" <<'"'"'RS'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*RS$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/audit-apply-scope.yml > "$RUNNER_TEMP/patch.rs"
          test -s "$RUNNER_TEMP/patch.rs"
          rustc --edition=2021 "$RUNNER_TEMP/patch.rs" -o "$RUNNER_TEMP/patch"
          "$RUNNER_TEMP/patch"
          cat > "$RUNNER_TEMP/cleanup.rs" <<'RS'
          use std::fs;
          fn main() {
              let path = "src/scope.rs";
              let mut text = fs::read_to_string(path).unwrap();
              let marker = "\n    pub(crate) fn single_variants(&self) -> Vec<Self> {";
              let start = text.find(marker).expect("single_variants start");
              text.insert_str(start + 1, "    #[cfg(test)]\n");
              fs::write(path, text).unwrap();
          }
          RS
          rustc --edition=2021 "$RUNNER_TEMP/cleanup.rs" -o "$RUNNER_TEMP/cleanup"
          "$RUNNER_TEMP/cleanup"
          cargo fmt --all
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/audit-apply-scope.yml
          rm -f .github/audit-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize cfg scope repair'
          git push origin HEAD:audit-test-cfg-scope-20260823

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Documentation
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Package
        run: cargo package --locked
      - name: Cargo install
        run: cargo install --path . --locked --force
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/crap4rust.exe --version
            target/native-install/bin/crap4rust.exe --help >/dev/null
          else
            target/native-install/bin/crap4rust --version
            target/native-install/bin/crap4rust --help >/dev/null
          fi
      - name: Install Rust coverage tool
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --version
      - name: End-to-end Rust coverage and CRAP check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/coverage-crate"
          report="$fixture/target/coverage/lcov.info"
          cd "$fixture"
          cargo llvm-cov clean
          mkdir -p target/coverage
          cargo llvm-cov --all-features --lcov --output-path "$report"
          test -s "$report"
          "$GITHUB_WORKSPACE/target/native-install/bin/crap4rust" \
            --root "$fixture" \
            --coverage "$report" \
            --no-test \
            --fail-over 6 \
            --json
      - name: End-to-end explicit feature selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/feature-crate"
          output="$($GITHUB_WORKSPACE/target/native-install/bin/crap4rust \
            --root "$fixture" \
            --features extra \
            --fail-over 6 \
            --json)"
          printf '%s\n' "$output"
          grep -q '"name": "feature_only"' <<<"$output"
          grep -q '"missing_coverage": 0' <<<"$output"

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
