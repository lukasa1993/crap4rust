name: Audit production quality-tool portfolio v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.head_ref == 'portfolio-production-audit-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-production-audit-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit build tools
        run: python -m pip install --upgrade pip build
      - name: Audit all 24 current main branches
        run: python tools/audit_quality_portfolio_v2.py --report portfolio-audit-v2.json
      - name: Upload exact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-audit-v2
          path: portfolio-audit-v2.json
          if-no-files-found: warn
          retention-days: 30
